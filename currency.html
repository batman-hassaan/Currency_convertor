<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="icon" href="currency-exchange.png">
    <link rel="stylesheet" href="currecny.css">
</head>

<body>
    <div class="converter-container">
        <h2>Currency Exchange</h2>
        <p>Check live rates, set rate alerts, receive notifications, and more.</p>

        <input type="number" id="amount" placeholder="Enter amount" />

        <div class="currency-select">
            <label for="from">From:</label>
            <select id="from">
               
            </select>
        </div>

        <div class="currency-select">
            <label for="to">To:</label>
            <select id="to">
                
            </select>
        </div>
        <button class="convert-btn" id="convert">Convert</button>
        <p id="result"></p>
    </div>
    
    <script src="currenies.js"></script>
    <script src="currency.js"></script>
</body>

</html>
